<svg viewBox="0 0 1500 1020" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1500" height="1020" fill="#F7F8FA"/>

  <text x="60" y="55" font-size="28" font-weight="600" fill="#1F2430">FinCast v1 Pipeline</text>
  <text x="60" y="80" font-size="15" fill="#5B6472">news + price in, next-day move prediction out — two local models, different jobs</text>

  <!-- Legend -->
  <g font-size="13" fill="#1F2430">
    <rect x="900" y="30" width="18" height="18" fill="#E4E9F0" stroke="#94A3B8"/>
    <text x="926" y="44">data-only step, no LLM call</text>
    <rect x="900" y="54" width="18" height="18" fill="#CCFBF1" stroke="#0F766E"/>
    <text x="926" y="68">Local LLM #1 — Phi-3-mini-128k (read/summarize/dedup)</text>
    <rect x="900" y="78" width="18" height="18" fill="#E0E7FF" stroke="#4338CA"/>
    <text x="926" y="92">Local LLM #2 — fine-tuned Phi-3-mini-4k (predict)</text>
  </g>

  <!-- Row 1: nightly collection -->
  <g font-size="14">
    <rect x="60" y="130" width="300" height="90" rx="6" fill="#E4E9F0" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="210" y="165" text-anchor="middle" font-weight="600" fill="#1F2430">GDELT DOC API</text>
    <text x="210" y="185" text-anchor="middle" fill="#5B6472" font-family="monospace" font-size="12">fetch_gdelt_news.py</text>
    <text x="210" y="203" text-anchor="middle" fill="#5B6472" font-size="12">query watchlist → article URLs</text>

    <rect x="410" y="130" width="300" height="90" rx="6" fill="#E4E9F0" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="560" y="165" text-anchor="middle" font-weight="600" fill="#1F2430">Scraper</text>
    <text x="560" y="185" text-anchor="middle" fill="#5B6472" font-family="monospace" font-size="12">scraper.py</text>
    <text x="560" y="203" text-anchor="middle" fill="#5B6472" font-size="12">download + extract clean article text</text>

    <rect x="760" y="130" width="300" height="90" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="910" y="160" text-anchor="middle" font-weight="600" fill="#1F2430">Sentiment Scoring</text>
    <text x="910" y="178" text-anchor="middle" fill="#0F766E" font-family="monospace" font-size="12">label_sentiment.py — LLM #1</text>
    <text x="910" y="196" text-anchor="middle" fill="#5B6472" font-size="12">summarize + score, 1 call/article</text>

    <rect x="1110" y="130" width="330" height="90" rx="6" fill="#E4E9F0" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="1275" y="160" text-anchor="middle" font-weight="600" fill="#1F2430">Fetch Prices</text>
    <text x="1275" y="178" text-anchor="middle" fill="#5B6472" font-family="monospace" font-size="12">fetch_prices.py (yfinance)</text>
    <text x="1275" y="196" text-anchor="middle" fill="#5B6472" font-size="12">trailing trend + vol-normalized label</text>
  </g>

  <!-- arrows row1 -->
  <g stroke="#5B6472" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="360" y1="175" x2="405" y2="175"/>
    <line x1="710" y1="175" x2="755" y2="175"/>
    <line x1="1060" y1="175" x2="1105" y2="175"/>
  </g>

  <!-- down arrow into build step -->
  <line x1="1275" y1="220" x2="1275" y2="260" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1275" y1="260" x2="770" y2="260" stroke="#5B6472" stroke-width="2"/>
  <line x1="770" y1="260" x2="770" y2="300" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: build ticker dataset (shared component) -->
  <rect x="450" y="300" width="640" height="110" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="770" y="335" text-anchor="middle" font-weight="600" font-size="16" fill="#1F2430">Build Ticker Dataset</text>
  <text x="770" y="356" text-anchor="middle" fill="#0F766E" font-family="monospace" font-size="12">build_ticker_jsonl.py — LLM #1 again</text>
  <text x="770" y="376" text-anchor="middle" fill="#5B6472" font-size="12">dedup near-duplicate articles (batches of ≤5) →</text>
  <text x="770" y="394" text-anchor="middle" fill="#5B6472" font-size="12">rank + keep top 5 by signal, one row per ticker-day</text>

  <!-- split into two branches -->
  <line x1="770" y1="410" x2="770" y2="440" stroke="#5B6472" stroke-width="2"/>
  <line x1="330" y1="440" x2="1210" y2="440" stroke="#5B6472" stroke-width="2"/>
  <line x1="330" y1="440" x2="330" y2="475" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1210" y1="440" x2="1210" y2="475" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="430" text-anchor="middle" font-size="12" fill="#5B6472" font-style="italic">training time</text>
  <text x="1210" y="430" text-anchor="middle" font-size="12" fill="#5B6472" font-style="italic">every night, live</text>

  <!-- Left branch: training -->
  <rect x="170" y="475" width="320" height="80" rx="6" fill="#E4E9F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="330" y="505" text-anchor="middle" font-weight="600" fill="#1F2430">Combine &amp; Split</text>
  <text x="330" y="524" text-anchor="middle" fill="#5B6472" font-family="monospace" font-size="12">combine_datasets.py</text>
  <text x="330" y="542" text-anchor="middle" fill="#5B6472" font-size="12">train.jsonl / val.jsonl, split by date</text>

  <line x1="330" y1="555" x2="330" y2="590" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="590" width="320" height="90" rx="6" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
  <text x="330" y="620" text-anchor="middle" font-weight="600" fill="#1F2430">QLoRA Fine-Tune</text>
  <text x="330" y="638" text-anchor="middle" fill="#4338CA" font-family="monospace" font-size="12">fine_tune.py</text>
  <text x="330" y="656" text-anchor="middle" fill="#5B6472" font-size="12">Phi-3-mini-4k, 4-bit QLoRA, 6GB laptop GPU</text>
  <text x="330" y="672" text-anchor="middle" fill="#5B6472" font-size="12">→ produces LLM #2 adapter</text>

  <!-- Right branch: live -->
  <rect x="1050" y="475" width="320" height="90" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1210" y="502" text-anchor="middle" font-weight="600" fill="#1F2430">Build Live Payload</text>
  <text x="1210" y="520" text-anchor="middle" fill="#0F766E" font-family="monospace" font-size="12">predict_ticker.py — reuses LLM #1</text>
  <text x="1210" y="538" text-anchor="middle" fill="#5B6472" font-size="12">same dedup + selection code as training,</text>
  <text x="1210" y="554" text-anchor="middle" fill="#5B6472" font-size="12">today's date, no label yet</text>

  <line x1="1210" y1="565" x2="1210" y2="600" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1050" y="600" width="320" height="80" rx="6" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
  <text x="1210" y="630" text-anchor="middle" font-weight="600" fill="#1F2430">Predict</text>
  <text x="1210" y="648" text-anchor="middle" fill="#4338CA" font-family="monospace" font-size="12">predict_ticker.py — LLM #2</text>
  <text x="1210" y="666" text-anchor="middle" fill="#5B6472" font-size="12">loaded once, one generation per ticker</text>

  <line x1="1210" y1="680" x2="1210" y2="715" stroke="#5B6472" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1050" y="715" width="320" height="80" rx="6" fill="#E4E9F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1210" y="745" text-anchor="middle" font-weight="600" fill="#1F2430">Reconcile</text>
  <text x="1210" y="764" text-anchor="middle" fill="#5B6472" font-family="monospace" font-size="12">reconcile_predictions.py</text>
  <text x="1210" y="782" text-anchor="middle" fill="#5B6472" font-size="12">next trading day settles → fills in actual outcome</text>

  <!-- dashed arrow: adapter feeds live predict -->
  <path d="M 490 635 C 750 635, 750 630, 1045 630" stroke="#4338CA" stroke-width="2" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="770" y="620" text-anchor="middle" font-size="12" fill="#4338CA" font-style="italic">fine-tuned adapter loaded here, nightly</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B6472"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4338CA"/>
    </marker>
  </defs>

  <text x="60" y="960" font-size="13" fill="#5B6472">Two models, never loaded together: LLM #1 (general-purpose, long-context) does all the reading — sentiment scoring runs once per raw article,</text>
  <text x="60" y="980" font-size="13" fill="#5B6472">dedup runs once per batch of ≤5 candidates. LLM #2 (fine-tuned, narrow) does all the predicting — loaded once per run, then one generation per ticker.</text>
</svg>
