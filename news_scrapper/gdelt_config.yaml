# FinCast — Master Configuration

# ---------------------------------------------------------------------------
# Nightly run schedule
# ---------------------------------------------------------------------------
schedule:
  time: "22:00"
  timezone: "PST"

# ---------------------------------------------------------------------------
# GDELT watchlist — queries sent to GDELT DOC API
# ---------------------------------------------------------------------------
watchlist:
  companies:
    - '(NVIDIA OR NVDA)'
    - '(Apple OR AAPL)'
    - '(Microsoft OR MSFT)'
    - '(Meta OR META)'
    - '(Tesla OR TSLA)'
    - '(Amazon OR AMZN)'
    - '(Google OR GOOGL)'
    - '(Intel OR INTC)'
    - '"AMD"'
    - '"OpenAI"'

  sectors:
    - semiconductor
    - cloud computing
    - electric vehicles
    - healthcare stocks
    - financial sector
    - artificial intelligence market

  macro:
    - '("Federal Reserve" OR "Fed rates")'
    - '"US inflation"'
    - '"oil prices"'
    - '"trade war" tariffs technology'
    - '"US recession"'
    - '"treasury yields"'
    - '"dollar index"'
    - '"geopolitical risk"'
    - '"antitrust" "big tech"'
    - '"AI regulation"'
    - '("China" "technology ban" OR "export controls")'
    - '"cybersecurity breach"'

# ---------------------------------------------------------------------------
# Ticker mappings — gdelt query -> stock/ETF ticker
# ---------------------------------------------------------------------------
tickers:
  # Company watchlist queries -> ticker
  company_queries:
    '(NVIDIA OR NVDA)':    NVDA
    '(Apple OR AAPL)':     AAPL
    '(Microsoft OR MSFT)': MSFT
    '(Meta OR META)':      META
    '(Tesla OR TSLA)':     TSLA
    '(Amazon OR AMZN)':    AMZN
    '(Google OR GOOGL)':   GOOGL
    '(Intel OR INTC)':     INTC
    '"AMD"':               AMD
    '"OpenAI"':            ~        # private — no ticker

  # Plain name fallback (for older articles)
  plain_names:
    NVIDIA:    NVDA
    Apple:     AAPL
    Microsoft: MSFT
    Meta:      META
    Tesla:     TSLA
    Amazon:    AMZN
    Google:    GOOGL
    Intel:     INTC
    AMD:       AMD
    OpenAI:    ~        # private — no ticker

  # Sector/macro queries -> ETF proxy
  sector_queries:
    semiconductor:                                   SOXX
    cloud computing:                                 SKYY
    electric vehicles:                               DRIV
    healthcare stocks:                               XLV
    financial sector:                                XLF
    artificial intelligence market:                  BOTZ
    '("Federal Reserve" OR "Fed rates")':            SPY
    '"US inflation"':                                SPY
    '"oil prices"':                                  USO
    '"trade war" tariffs technology':                XLK
    '"US recession"':                                SPY
    '"treasury yields"':                             TLT
    '"dollar index"':                                UUP
    '"geopolitical risk"':                           SPY
    '"antitrust" "big tech"':                        XLK
    '"AI regulation"':                               BOTZ
    '("China" "technology ban" OR "export controls")': SOXX
    '"cybersecurity breach"':                        CIBR

  # Benchmark index per ticker (for relative performance)
  benchmarks:
    # Tech companies -> Nasdaq
    NVDA:  QQQ
    AAPL:  QQQ
    MSFT:  QQQ
    META:  QQQ
    TSLA:  QQQ
    AMZN:  QQQ
    GOOGL: QQQ
    INTC:  QQQ
    AMD:   QQQ
    # Sector ETFs -> broad market
    SOXX:  SPY
    SKYY:  SPY
    DRIV:  SPY
    XLV:   SPY
    XLF:   SPY
    BOTZ:  SPY
    # Macro proxies -> broad market
    USO:   SPY
    TLT:   SPY
    UUP:   SPY
    XLK:   SPY
    CIBR:  SPY

  # Known private companies — no ticker, skip price fetch silently
  private_companies:
    - '"OpenAI"'
    - OpenAI
    - Anthropic

